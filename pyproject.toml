[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "nussif-data"
version = "0.4.1"
description = "One-line access to CBOE, FRED, Massive, Alpha Vantage and Databento market data"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "pyarrow>=14",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]
databento = ["databento>=0.80"]

[project.scripts]
nussif-data = "nussif_data.cli:main"

[tool.setuptools.packages.find]
include = ["nussif_data*"]

[tool.setuptools.package-data]
nussif_data = ["catalog.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "PIE", "RUF"]
ignore = [
    "E501",    # line length — the formatter handles wrapping
    "SIM105",  # contextlib.suppress vs try/except/pass — try/except reads fine
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402", "B011"]

[tool.ruff.format]
quote-style = "double"
