[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "nussif-data"
version = "0.10.0"
description = "One-line access to CBOE, FRED, Massive, Alpha Vantage and Databento market data"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "pyarrow>=14",
    "pyyaml>=6",
    "rich>=13",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]
databento = ["databento>=0.80"]
# only nd.massive.option_chain()'s concurrent per-contract quote fetch needs this --
# the shared HttpClient (bars, everything else) stays stdlib-only. Lazily imported,
# so the rest of the package works fine without it.
massive-options = ["requests>=2.31"]

[project.scripts]
nussif-data = "nussif_data.cli:main"

[tool.setuptools.packages.find]
include = ["nussif_data*"]

[tool.setuptools.package-data]
nussif_data = ["catalog.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["*.md"]  # READMEs use hand-aligned sample code; keep ruff off them

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "PIE", "RUF"]
ignore = [
    "E501",    # line length — the formatter handles wrapping
    "SIM105",  # contextlib.suppress vs try/except/pass — try/except reads fine
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402", "B011"]
"scripts/*" = ["SIM105", "B904"]  # standalone prototype/ops scripts, not library code

[tool.ruff.format]
quote-style = "double"
