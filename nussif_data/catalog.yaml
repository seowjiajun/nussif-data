# nussif-data catalog — connectors and the datasets they serve.
# The *how to reach it* (URLs, params, auth, rate limits). Connectors own parsing.
# No symbol lists: every accessor takes explicit symbols and any valid one works.

connectors:

  cboe:
    auth: none
    datasets:
      vol_index:                      # -> nussif_data.cboe.vol_index("VIX", "VIX3M")
        url_template: "https://cdn.cboe.com/api/global/us_indices/daily_prices/{symbol}_History.csv"

  fred:
    auth: none
    rate_limit_rpm: 90               # fredgraph.csv 404s under burst -> pace it
    datasets:
      macro_series:                   # -> nussif_data.fred.series("BAA10Y", "UNRATE")
        url_template: "https://fred.stlouisfed.org/graph/fredgraph.csv?id={id}&cosd={history_start}"
        history_start: "1970-01-01"
        # friendly names for common series; callers may also pass any raw FRED id.
        # ICE BofA OAS series are licence-capped to ~3y on the public CSV -> use Moody's.
        aliases:
          baa10y: BAA10Y
          aaa10y: AAA10Y
          nfci:   NFCI
          anfci:  ANFCI
          sofr:   SOFR
          dgs3mo: DGS3MO
          dgs2:   DGS2
          dgs10:  DGS10
          t10y3m: T10Y3M
          t10y2y: T10Y2Y

  massive:
    auth:
      type: query_key
      param: apiKey
      vendor: massive               # -> nussif_data._config.get_key("massive")
    base_url: "https://api.massive.com"
    rate_limit_rpm: 40              # shared key -> keep low
    datasets:
      daily_bars:                     # -> nussif_data.massive.bars("SPY", "QQQ")
        endpoint: "/v2/aggs/ticker/{ticker}/range/1/day/{start}/{end}"
        params: {adjusted: "true", sort: "asc", limit: "50000"}
        history_start: "2003-01-01"
        trim_gap_days: 15
