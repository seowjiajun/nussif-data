# nussif-data catalog — connectors and the datasets they serve.
# The *how to reach it* (URLs, params, auth, rate limits). Connectors own parsing.
# No symbol lists: every accessor takes explicit symbols and any valid one works.

connectors:

  cboe:
    auth: none
    datasets:
      vol_index:                      # -> nussif_data.cboe.vol_index("VIX", "VIX3M")
        url_template: "https://cdn.cboe.com/api/global/us_indices/daily_prices/{symbol}_History.csv"

  fred:
    auth: none
    rate_limit_rpm: 90               # fredgraph.csv 404s under burst -> pace it
    datasets:
      macro_series:                   # -> nussif_data.fred.series("BAA10Y", "UNRATE")
        # FRED's own series ids, verbatim -- no invented aliases. Look one up at
        # https://fred.stlouisfed.org, or see README.md for ones this project uses.
        url_template: "https://fred.stlouisfed.org/graph/fredgraph.csv?id={id}&cosd={history_start}"
        history_start: "1970-01-01"
        # ICE BofA OAS series (BAMLH0A0HYM2 etc.) are licence-capped to ~3y on the
        # public CSV regardless of cosd -- use Moody's BAA10Y/AAA10Y instead.

  massive:
    auth:
      type: query_key
      param: apiKey
      vendor: massive               # -> nussif_data._config.get_key("massive")
    base_url: "https://api.massive.com"
    rate_limit_rpm: 40              # shared key -> keep low
    datasets:
      daily_bars:                     # -> nussif_data.massive.bars("SPY", "QQQ")
        endpoint: "/v2/aggs/ticker/{ticker}/range/1/day/{start}/{end}"
        params: {adjusted: "true", sort: "asc", limit: "50000"}
        history_start: "2003-01-01"
        trim_gap_days: 15

  alphavantage:
    auth:
      type: query_key
      param: apikey
      vendor: alphavantage         # -> nussif_data._config.get_key("alphavantage")
    base_url: "https://www.alphavantage.co"
    rate_limit_rpm: 30            # HISTORICAL_OPTIONS is premium-only; premium is 75+ req/min
    datasets:
      option_chain:                 # -> nussif_data.alphavantage.option_chain("SPY", date="2024-06-03")
        endpoint: "/query"
        params: {function: HISTORICAL_OPTIONS}
        history_start: "2008-01-01"  # one request = one full EOD chain for a (symbol, date)

  databento:
    auth:
      type: sdk_key                 # databento's own client, not the shared HttpClient
      vendor: databento             # -> nussif_data._config.get_key("databento")
    dataset: OPRA.PILLAR
    datasets:
      option_chain:                 # -> nussif_data.databento.option_chain("SPY", date="2024-06-03", spot=530)
        definition_schema: definition
        quote_schema: cbbo-1m
        close_tz: America/New_York
        close_time: "16:00"
        history_start: "2013-04-01"
        default_moneyness: 0.25      # keep strikes within +-25% of spot
        default_min_dte: 0           # raise it to skip the daily/weekly expiries
        default_max_dte: 150
        max_quote_symbols: 2000      # databento get_range hard cap -> chunk above this
